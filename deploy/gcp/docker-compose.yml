services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: plm-agent:${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    env_file:
      - ${SECRETS_FILE:-/opt/plm-agent/secrets/app.env}
    environment:
      PLM_PROJECT_ROOT: /app
      PLM_WEB_DATA_DIR: /var/lib/plm-agent-web
      PLM_WEB_PUBLIC_PROTOTYPE: "true"
      PLM_WEB_JOB_TIMEOUT_SECONDS: ${PLM_WEB_JOB_TIMEOUT_SECONDS:-1800}
      PLM_WEB_MAX_IMAGE_PIXELS: ${PLM_WEB_MAX_IMAGE_PIXELS:-80000000}
      PLM_OPENAI_TIMEOUT_SECONDS: ${PLM_OPENAI_TIMEOUT_SECONDS:-180}
      PLM_OPENAI_MAX_RETRIES: ${PLM_OPENAI_MAX_RETRIES:-2}
    volumes:
      - ${PERSIST_ROOT:-/var/lib/plm-agent}/web-data:/var/lib/plm-agent-web
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/Database/Material_Database.xlsx:/app/Database/Material_Database.xlsx:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/student_z_2304_B_current_images.npy:/app/NEHM_RESULTS/student_inference_B/student_z_2304_B_current_images.npy:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_sparse_codes.npy:/app/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_sparse_codes.npy:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_dictionary_atoms.npy:/app/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_dictionary_atoms.npy:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_embedding_mean.npy:/app/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_embedding_mean.npy:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_ksvd_config.json:/app/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/global_ksvd_config.json:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/atom_microscopy_labels.json:/app/NEHM_RESULTS/student_inference_B/global_dictionary_interpretability/atom_microscopy_labels.json:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/NEHM_RESULTS/vit_student_finetune_best_B_logitb.pth:/app/NEHM_RESULTS/vit_student_finetune_best_B_logitb.pth:ro
      - ${ARTIFACT_ROOT:-/var/lib/plm-agent/artifacts}/LongCLIP/checkpoints/longclip-B.pt:/app/LongCLIP/checkpoints/longclip-B.pt:ro
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10)"
      interval: 15s
      timeout: 12s
      retries: 20
      start_period: 180s
